services:
  - type: web
    name: heart-disease-predictor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FLUXBASE_PROJECT_ID
        sync: false
      - key: FLUXBASE_API_KEY
        sync: false
